# GitLab CI/CD pipeline: Terraform + Ansible
# Required CI/CD variables (Settings > CI/CD > Variables):
#   AWS_ACCESS_KEY_ID        - AWS access key
#   AWS_SECRET_ACCESS_KEY    - AWS secret key
#   SSH_PRIVATE_KEY          - SSH private key for EC2 access

stages:
  - terraform
  - ansible

variables:
  TF_VERSION: "1.5.7"
  ENVIRONMENT: "dev"
  AWS_REGION: "us-east-1"
  TF_DIR: "terraform/environments/dev"

terraform:
  stage: terraform
  image: hashicorp/terraform:${TF_VERSION}
  script:
    - cd $TF_DIR
    - terraform init
    - terraform apply -auto-approve
  artifacts:
    paths:
      - $TF_DIR/.terraform
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - terraform/**/*
        - ansible/**/*
    - when: manual

ansible:
  stage: ansible
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - pip install ansible
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$(terraform -chdir=$TF_DIR output -raw nginx_public_ip)" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - bash scripts/terraform-to-ansible.sh $ENVIRONMENT
    - cd ansible
    - ansible-playbook playbooks/site.yml
  dependencies:
    - terraform
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - terraform/**/*
        - ansible/**/*
    - when: manual
