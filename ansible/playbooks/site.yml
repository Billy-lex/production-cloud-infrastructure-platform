# Main playbook: provisions all hosts with Docker, configures Nginx reverse proxy
# and deploys Prometheus monitoring on app servers
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit webservers
#   ansible-playbook playbooks/site.yml --limit appservers

# Install Docker on all hosts
- name: Install Docker on all hosts
  hosts: dev
  become: true
  roles:
    - docker

# Configure Nginx reverse proxy on webservers
- name: Configure Nginx reverse proxy
  hosts: webservers
  become: true
  roles:
    - nginx

# Deploy Node Exporter, Prometheus and Grafana monitoring on app servers
- name: Deploy monitoring stack
  hosts: appservers
  become: true
  roles:
    - node_exporter
    - prometheus
    - grafana
