[defaults]
inventory = inventory/dev
remote_user = ubuntu
host_key_checking = False
retry_files_enabled = False
roles_path = roles
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
