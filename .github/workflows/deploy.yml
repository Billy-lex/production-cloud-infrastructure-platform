name: Deploy Infrastructure & Configure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - "application/**"
  workflow_dispatch:

env:
  TF_VERSION: "1.5.7"
  ANSIBLE_VERSION: "9.4.0"
  AWS_REGION: "us-east-1"
  ENVIRONMENT: "dev"

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    outputs:
      ecr_repository_url: ${{ steps.outputs.outputs.ecr_repository_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Export Terraform outputs
        id: outputs
        run: |
          terraform output -json > ${{ runner.temp }}/tf_outputs.json
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "ecr_repository_url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          path: ${{ runner.temp }}/tf_outputs.json
          retention-days: 1

  ansible:
    name: Ansible Configure
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible==${{ env.ANSIBLE_VERSION }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ${{ runner.temp }}

      - name: Generate Ansible inventory
        run: bash scripts/generate-inventory-from-json.sh ${{ runner.temp }}/tf_outputs.json ${{ env.ENVIRONMENT }}

      - name: Run Ansible playbook
        working-directory: ansible
        run: ansible-playbook -i inventory/${{ env.ENVIRONMENT }} playbooks/site.yml
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/deploy_key

  build-push:
    name: Build & Push Docker Image
    needs: ansible
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_repository_url: ${{ needs.terraform.outputs.ecr_repository_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ needs.terraform.outputs.ecr_repository_url }}

      - name: Determine image tag
        id: meta
        run: |
          TAG=$(date +%Y%m%d)-${GITHUB_SHA::7}
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        working-directory: application
        run: |
          ECR_URL=${{ needs.terraform.outputs.ecr_repository_url }}
          docker build -t $ECR_URL:${{ steps.meta.outputs.image_tag }} .
          docker push $ECR_URL:${{ steps.meta.outputs.image_tag }}

  deploy:
    name: Deploy Application
    needs: [terraform, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible==${{ env.ANSIBLE_VERSION }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ${{ runner.temp }}

      - name: Generate Ansible inventory
        run: bash scripts/generate-inventory-from-json.sh ${{ runner.temp }}/tf_outputs.json ${{ env.ENVIRONMENT }}

      - name: Deploy application via Ansible
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/${{ env.ENVIRONMENT }} playbooks/app-deploy.yml \
            -e "ecr_repository_url=${{ needs.terraform.outputs.ecr_repository_url }}" \
            -e "image_tag=${{ needs.build-push.outputs.image_tag }}" \
            -e "aws_region=${{ env.AWS_REGION }}"
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/deploy_key
