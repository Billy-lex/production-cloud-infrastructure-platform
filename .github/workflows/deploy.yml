name: Deploy Infrastructure & Configure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
  workflow_dispatch:

env:
  TF_VERSION: "1.5.7"
  ANSIBLE_VERSION: "9.4.0"
  AWS_REGION: "us-east-1"
  ENVIRONMENT: "dev"

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
    outputs:
      nginx_ip: ${{ steps.apply.outputs.nginx_ip }}

  ansible:
    name: Ansible Configure
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible==${{ env.ANSIBLE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add ~/.ssh/deploy_key
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock

      - name: Generate Ansible inventory from Terraform
        run: bash scripts/terraform-to-ansible.sh ${{ env.ENVIRONMENT }}

      - name: Run Ansible playbook
        working-directory: ansible
        run: ansible-playbook playbooks/site.yml
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/deploy_key
